<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏合集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 小游戏合集</h1>
            <p>经典游戏 HTML5 纯前端实现</p>
        </header>
        <div class="games-grid">
            <div class="game-card">
                <div class="game-icon">🧱</div>
                <h2>俄罗斯方块</h2>
                <p>经典俄罗斯方块，支持键盘和触屏操作，顺时针旋转，适配手机。</p>
                <div class="tags">
                    <span>经典</span>
                    <span>益智</span>
                    <span>10x20</span>
                </div>
                <a href="./tetris/" class="play-btn">开始玩</a>
            </div>
            <div class="game-card">
                <div class="game-icon">🚂</div>
                <h2>坦克大战</h2>
                <p>经典FC坦克大战，保护基地，消灭敌人，多关卡进阶。</p>
                <div class="tags">
                    <span>经典</span>
                    <span>射击</span>
                    <span>闯关</span>
                </div>
                <a href="./battle-city/" class="play-btn">开始玩</a>
            </div>
            <div class="game-card">
                <div class="game-icon">🥔</div>
                <h2>土豆兄弟</h2>
                <p>幸存者like吸血鬼游戏，自动射击，捡经验升级，随机升级选项。</p>
                <div class="tags">
                    <span>roguelike</span>
                    <span>生存</span>
                    <span>升级</span>
                </div>
                <a href="./potato-brothers/" class="play-btn">开始玩</a>
            </div>
        </div>
        <footer>
            <p>纯 HTML/CSS/JavaScript 实现，无需框架，直接运行</p>
        </footer>
    </div>
</body>
</html>
